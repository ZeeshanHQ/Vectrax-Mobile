name: supa_app
description: A premium Supabase Remote Control mobile app.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  supabase_flutter: ^2.0.0
  flutter_riverpod: ^2.4.9
  go_router: ^13.1.0
  flutter_secure_storage: ^9.0.0
  http: ^1.1.2
  google_fonts: ^6.1.0
  flutter_animate: ^4.2.0
  url_launcher: ^6.3.2
  app_links: ^6.4.1
  fl_chart: ^1.1.1
  shimmer: ^3.0.0
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  shared_preferences: ^2.5.4
  local_auth: ^2.1.6
  lottie: ^3.1.2
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
